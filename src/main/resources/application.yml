spring:
  application:
    name: library-api
  profiles:
    active: dev
  datasource:
    driver-class-name: ${DB_DRIVER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    generate-ddl: true
    properties:
      hibernate.hibernate.use_sql_comments: true
      hibernate:
        format_sql: true